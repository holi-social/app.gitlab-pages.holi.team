variables:
  YARN_ENABLE_GLOBAL_CACHE: 'false'

default:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:24-slim'
  tags:
    - 1cpu-4gb
  before_script:
    - set -e
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)

.yarn-cache-rw:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

.yarn-cache-readonly:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull

stages:
  - prepare
  - build

install_deps:
  stage: prepare
  cache: !reference [.yarn-cache-rw]
  variables:
    # it causes problems when this variable is defined globally and the job is triggered from unified-api
    YARN_CACHE_FOLDER: '${CI_PROJECT_DIR}/.yarn/cache'
  script:
    - corepack enable
    - yarn install --immutable
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH
      changes:
        - yarn.lock
        - .gitlab-ci.yml

.build:
  stage: build
  needs:
    - job: install_deps
      optional: true
  cache: !reference [.yarn-cache-rw]
  variables:
    # it causes problems when this variable is defined globally and the job is triggered from unified-api
    YARN_CACHE_FOLDER: '${CI_PROJECT_DIR}/.yarn/cache'
  script:
    - corepack enable
    # If CI Cache is empty because install_deps did not run, install filling the cache, otherwise install from the immutable cache
    # install_deps does not run on long living branches, and it might not run on pipeline failures on the first build of a branch
    - '[ ! -d ".yarn/cache" ] && yarn install --immutable || yarn install --immutable --immutable-cache'
    - yarn graphql-to-doc
    - yarn build

test:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != 'main'

pages:
  extends: .build
  after_script:
    - mv build/ public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
