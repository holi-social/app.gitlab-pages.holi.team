variables:
  YARN_CACHE_FOLDER: .yarn

default:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:22-slim'
  tags:
    - 1cpu-4gb
  before_script:
    - corepack enable


.yarn-cache:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

stages:
  - test
  - deploy

test:
  stage: test
  cache: !reference [.yarn-cache]
  script:
    - yarn install --immutable --immutable-cache
    - yarn graphql-to-doc
    - yarn build
  except:
    - main

pages:
  stage: deploy
  cache: !reference [.yarn-cache]
  script:
    - yarn install --immutable --immutable-cache
    - yarn graphql-to-doc
    - yarn build
    - mv build/ public/
  artifacts:
    paths:
    - public
  only:
    - main

