image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:22-slim'

stages:
  - test
  - deploy

test:
  stage: test
  script:
  - yarn install
  - yarn graphql-to-doc
  - yarn build
  except:
    - main

pages:
  stage: deploy
  script:
  - yarn install
  - yarn graphql-to-doc
  - yarn build
  - mv build/ public/
  artifacts:
    paths:
    - public
  only:
    - main

