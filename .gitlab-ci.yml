variables:
  YARN_CACHE_FOLDER: './.yarn/cache'

default:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:22-slim'
  tags:
    - 1cpu-4gb
  before_script:
    - corepack enable

.yarn-cache-rw:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

.yarn-cache-readonly:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull

stages:
  - build
  - test
  - deploy

install_deps:
  stage: build
  cache: !reference [.yarn-cache-rw]
  script:
    - yarn install --immutable

.build:
  stage: build
  needs: 
    - job: install_deps
      optional: true
  cache: !reference [.yarn-cache-readonly]
  script:
    - yarn install --immutable --immutable-cache
    - yarn graphql-to-doc
    - yarn build

test:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH != 'main'

pages:
  extends: .build
  after_script:
    - mv build/ public/
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

